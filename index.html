<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code To Heart 💕</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #ffb6c1; /* Màu hồng pastel */
            overflow: hidden;
        }
        .container {
            max-width: 300px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .password-display {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .password-box {
            width: 40px;
            height: 40px;
            font-size: 24px;
            text-align: center;
            border: 2px solid black;
            border-radius: 5px;
            background-color: white;
            line-height: 40px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
            margin: auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 200px;
            margin: auto;
            margin-top: 10px;
        }
        button {
            font-size: 20px;
            padding: 10px;
            cursor: pointer;
            background-color: #ff69b4; /* Màu hồng đậm hơn */
            color: white;
            border: none;
            border-radius: 5px;
            width: 50px;
            height: 50px;
        }
        button:hover {
            background-color: #ff1493; /* Màu hồng đậm hơn khi hover */
        }
        .alert-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffebef;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .alert-box button {
            margin-top: 10px;
            background-color: #ff69b4;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .heart {
            position: absolute;
            font-size: 24px;
            color: red;
            animation: floatUp 3s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2> 💫Quanhquanh🎂 </h2>
        <div class="password-display" id="passwordDisplay">
            <div class="password-box" id="box1"></div>
            <div class="password-box" id="box2"></div>
            <div class="password-box" id="box3"></div>
            <div class="password-box" id="box4"></div>
            <div class="password-box" id="box5"></div>
            <div class="password-box" id="box6"></div>
        </div>
        <div class="buttons">
            <button onclick="addDigit(1)">1</button>
            <button onclick="addDigit(2)">2</button>
            <button onclick="addDigit(3)">3</button>
            <button onclick="addDigit(4)">4</button>
            <button onclick="addDigit(5)">5</button>
            <button onclick="addDigit(6)">6</button>
            <button onclick="addDigit(7)">7</button>
            <button onclick="addDigit(8)">8</button>
            <button onclick="addDigit(9)">9</button>
        </div>
        <div class="controls">
            <button onclick="clearPassword()">⟵</button>
            <button onclick="addDigit(0)">0</button>
            <button onclick="checkPassword()">✓</button>
        </div>
    </div>

    <div class="alert-box" id="alertBox">
        <p>Mật khẩu sai rùii , thử lại nhen! ❌</p>
        <button onclick="closeAlert()">OK</button>
    </div>

    <script>
        let password = "";
        const correctPassword = "300908";
        
        function addDigit(digit) {
            if (password.length < 6) {
                password += digit;
                updateDisplay();
            }
        }
        
        function updateDisplay() {
            for (let i = 0; i < 6; i++) {
                document.getElementById("box" + (i + 1)).innerText = password[i] || "";
            }
        }
        
        function clearPassword() {
            password = password.slice(0, -1);
            updateDisplay();
        }
        
        function checkPassword() {
            if (password === correctPassword) {
                window.location.href = "https://baithuyettrinh-nhom5.my.canva.site/sinh-nhat";
            } else {
                document.getElementById("alertBox").style.display = "block";
                password = "";
                updateDisplay();
            }
        }
        
        function closeAlert() {
            document.getElementById("alertBox").style.display = "none";
        }
        
        function createHeart() {
            const heart = document.createElement("div");
            heart.innerHTML = "🎂";
            heart.className = "heart";
            document.body.appendChild(heart);
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = Math.random() * 100 + "vh";
            setTimeout(() => heart.remove(), 3000);
        }
        
        setInterval(() => {
            for (let i = 0; i < 5; i++) {
                createHeart();
            } 
        }, 1000);
    </script>
</body>
</html>
